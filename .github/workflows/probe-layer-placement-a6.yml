name: probe-layer-placement-a6
on:
  push:
    branches: [generation-a6]
    paths: ['.github/workflows/probe-layer-placement-a6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        placement: [first, last]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch placement
        if: matrix.placement == 'last'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/model.cpp')
          s=p.read_text()
          old='if(layer>=cfg_.morph_layers || !route) return;'
          new='if(layer < cfg_.layers - cfg_.morph_layers || !route) return;'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build canonical runtime
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git /tmp/NedoTokenizer
          python -m pip install /tmp/NedoTokenizer
          python -m pip install .
      - name: Generate
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo
          prompt='Kullanıcı talimatı:\nmerhaba\n\nAsistan cevabı:\n'
          m=nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          cfg=nedo.GenerationConfig(); cfg.max_new_tokens=24; cfg.temperature=0.0
          print('IDS',m.tokenize(prompt),flush=True)
          out=m.generate(prompt,cfg)
          print('OUTPUT_BEGIN',flush=True); print(out,flush=True); print('OUTPUT_END',flush=True)
          print('REPR',repr(out),flush=True)
          PY
