name: rope-half-smoke
on:
  push:
    branches: [rope-half-probe]
    paths:
      - 'src/kernels.cpp'
      - 'rope-half-smoke.stamp'
      - '.github/workflows/stream-smoke-a8.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: rope-half-probe}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install clean package
        run: python -m pip install .
      - name: F16 raw-sa half-split RoPE smoke
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python - <<'PY'
          import time
          import nedo.cpp as nedo
          m=nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          prompt='Kullanıcı talimatı:\nsa\n\nAsistan cevabı:\n'
          c=nedo.GenerationConfig(); c.max_new_tokens=16; c.temperature=0.0; c.seed=1
          chunks=[]
          def emit(text):
              chunks.append(text); print('CHUNK',repr(text),flush=True)
          out=m.generate_stream(prompt,c,on_text=emit)
          print('OUT',repr(out),flush=True)
          if not out.strip(): raise SystemExit('raw sa generated only whitespace')
          PY
