name: diag-sa
on:
  push:
    branches: [diag-sa]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install .
      - name: Probe sa
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo
          m=nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          prompt='Kullanıcı talimatı:\nsa\n\nAsistan cevabı:\n'
          print('PROMPT', m.tokenize(prompt), flush=True)
          for name,temp,seed in [('greedy',0.0,1),('sample1',0.8,1),('sample2',0.8,2),('sample3',0.8,3)]:
              c=nedo.GenerationConfig(); c.max_new_tokens=32; c.temperature=temp; c.top_p=.95; c.top_k=40; c.seed=seed
              ids=m.generate_ids(m.tokenize(prompt),c)
              print(name,'IDS',ids,flush=True)
              print(name,'TEXT',repr(m.detokenize(ids)),flush=True)
          PY
