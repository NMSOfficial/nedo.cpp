name: fix-windows-a6
on:
  push:
    branches: [generation-a6]
    paths: ['.github/workflows/fix-win-a6.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - name: Fix MSVC OpenMP SIMD pragmas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/kernels.cpp')
          s=p.read_text()
          s=s.replace('#if defined(_OPENMP)\n#pragma omp simd', '#if defined(_OPENMP) && !defined(_MSC_VER)\n#pragma omp simd')
          p.write_text(s)
          PY
          git config user.name 'Nedim Mutlu Sezer'
          git config user.email '154451479+NMSOfficial@users.noreply.github.com'
          git add src/kernels.cpp
          git commit -m 'Fix MSVC OpenMP SIMD portability'
          git push origin HEAD:generation-a6
