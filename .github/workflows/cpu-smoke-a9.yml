name: cpu-smoke-a9
on:
  push:
    branches: [cuda-a9]
    paths:
      - 'python/nedo/cli.py'
      - 'python/nedo/cpp.py'
      - 'src/model.cpp'
      - 'src/pybind.cpp'
      - 'include/nedo/model.hpp'
      - 'cpu-smoke-a9.stamp'
      - '.github/workflows/cpu-smoke-a9.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install .
      - name: Real F16 chat and repetition smoke
        env:
          OMP_NUM_THREADS: '4'
          NEDO_CUDA_BUILD: '0'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo
          from nedo.cli import _CHAT_STOPS, _build_prompt, _generation_config, build_parser

          model = nedo.import_llm(
              'Ethosoft/NedoLM-0.8B-SFT-6478-GGUF',
              quantization='F16',
              device='cpu',
          )
          args = build_parser().parse_args([
              'chat', 'Ethosoft/NedoLM-0.8B-SFT-6478-GGUF',
              '--max-tokens', '32', '--seed', '1',
          ])
          cfg = _generation_config(args)
          assert cfg.repetition_penalty == 1.15
          assert cfg.no_repeat_ngram_size == 4

          def assert_no_new_repeated_ngram(prompt, output, n=4):
              prompt_ids = model.tokenize(prompt)
              output_ids = model.tokenize(output)
              sequence = list(prompt_ids)
              seen = {
                  tuple(sequence[i:i+n])
                  for i in range(max(0, len(sequence) - n + 1))
              }
              for token_id in output_ids:
                  sequence.append(token_id)
                  if len(sequence) < n:
                      continue
                  gram = tuple(sequence[-n:])
                  if gram in seen:
                      raise SystemExit(f'repeated {n}-gram escaped sampler: {gram}')
                  seen.add(gram)

          forbidden = (
              'Gerekçe:', 'Kullanıcı talimatı:', 'Asistan cevabı:',
              '<|im_end|>', '<|end|>', '<düşünme>', '</düşünme>',
          )
          history = []
          for user in ('naber kingo', 'ne dedin yani'):
              prompt = _build_prompt(history, user)
              out = model.generate_stream(prompt, cfg, stop=_CHAT_STOPS)
              print('PROMPT', repr(user), 'OUT', repr(out), flush=True)
              if not out.strip():
                  raise SystemExit(f'{user}: empty output')
              if any(marker in out for marker in forbidden):
                  raise SystemExit(f'{user}: leaked training/template artifact: {out!r}')
              assert_no_new_repeated_ngram(prompt, out, cfg.no_repeat_ngram_size)
              history.append((user, out))
          PY
