name: cpu-smoke-a9
on:
  push:
    branches: [cuda-a9]
    paths:
      - 'python/nedo/cli.py'
      - 'python/nedo/cpp.py'
      - 'src/model.cpp'
      - 'src/pybind.cpp'
      - 'include/nedo/model.hpp'
      - 'cpu-smoke-a9.stamp'
      - '.github/workflows/cpu-smoke-a9.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install .
      - name: Probe instruction-first history adapter on real F16
        env:
          OMP_NUM_THREADS: '4'
          NEDO_CUDA_BUILD: '0'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo
          from nedo.cli import _CHAT_STOPS, _generation_config, build_parser

          model = nedo.import_llm(
              'Ethosoft/NedoLM-0.8B-SFT-6478-GGUF',
              quantization='F16',
              device='cpu',
          )
          args = build_parser().parse_args([
              'chat', 'Ethosoft/NedoLM-0.8B-SFT-6478-GGUF',
              '--max-tokens', '12', '--seed', '1',
          ])
          cfg = _generation_config(args)

          current_user = 'ne dedin yani'
          context = 'Kullanıcı: naber kingo\nAsistan: Merhaba! Size nasıl yardımcı olabilirim?'
          prompt = (
              'Kullanıcı talimatı:\n'
              f'Aşağıdaki önceki konuşmayı dikkate alarak kullanıcının şu yeni mesajına doğal, kısa ve doğrudan Türkçe yanıt ver: {current_user}\n'
              'Yalnızca cevabı yaz.\n\n'
              f'Ek bilgi:\n{context}\n\n'
              'Asistan cevabı:\n'
          )
          out = model.generate_stream(prompt, cfg, stop=_CHAT_STOPS)
          print('INSTRUCTION_FIRST_HISTORY', repr(out), flush=True)
          PY
