name: cpu-smoke-a9
on:
  push:
    branches: [cuda-a9]
    paths:
      - 'python/nedo/cli.py'
      - 'python/nedo/cpp.py'
      - 'src/model.cpp'
      - 'src/kernels.cpp'
      - 'cpu-smoke-a9.stamp'
      - '.github/workflows/cpu-smoke-a9.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install package
        run: python -m pip install .
      - name: Probe real F16 SFT chat prompts
        env:
          OMP_NUM_THREADS: '4'
          NEDO_CUDA_BUILD: '0'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo
          from nedo.cli import _CHAT_STOPS
          m = nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16', device='cpu')
          c = nedo.GenerationConfig(); c.max_new_tokens=12; c.temperature=0.0; c.seed=1
          base='Kullanıcının şu mesajına doğal, kısa ve doğrudan Türkçe yanıt ver. Yalnızca cevabı yaz.'
          p1=f'Kullanıcı talimatı:\n{base}\n\nEk bilgi:\nnaber kingo\n\nAsistan cevabı:\n'
          out1=m.generate_stream(p1,c,stop=_CHAT_STOPS)
          print('FIRST',repr(out1),flush=True)
          transcript='Önceki konuşma:\nKullanıcı: naber kingo\nAsistan: '+out1.strip()+'\n\nSon kullanıcı mesajı:\nne dedin yani'
          p2a=f'Kullanıcı talimatı:\n{base}\n\nEk bilgi:\n{transcript}\n\nAsistan cevabı:\n'
          p2b='Kullanıcı talimatı:\nÖnceki konuşmayı dikkate alarak kullanıcının son mesajına doğal, kısa ve doğrudan Türkçe yanıt ver. Yalnızca cevabı yaz.\n\nEk bilgi:\n'+transcript+'\n\nAsistan cevabı:\n'
          print('HISTORY_SAME',repr(m.generate_stream(p2a,c,stop=_CHAT_STOPS)),flush=True)
          print('HISTORY_EXPLICIT',repr(m.generate_stream(p2b,c,stop=_CHAT_STOPS)),flush=True)
          PY
