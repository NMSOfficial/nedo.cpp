name: tokenizer-parity-a6
on:
  push:
    branches: [generation-a6]
    paths:
      - 'src/tokenizer.cpp'
      - 'include/nedo/tokenizer.hpp'
      - 'src/model.cpp'
      - 'include/nedo/model.hpp'
      - 'src/pybind.cpp'
      - 'python/nedo/cpp.py'
      - '.github/workflows/tokenizer-parity-a6.yml'
      - 'release-gate.stamp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact NDSRF004 tokenizer parity
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git /tmp/NedoTokenizer
          python -m pip install /tmp/NedoTokenizer
          python -m pip install .
          python - <<'PY'
          from pathlib import Path
          from nedotokenizer import SurfaceTokenizer
          import nedo.cpp as nedo

          prompt = 'Kullanıcı talimatı:\nmerhaba\n\nAsistan cevabı:\n'
          vocab = Path('/tmp/NedoTokenizer/assets/surface-vocab.bin').read_bytes()
          reference = [int(x) for x in SurfaceTokenizer(vocab).encode_ids(prompt.encode('utf-8'))]
          model = nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          actual = model.tokenize(prompt)
          print('REFERENCE_IDS', reference)
          print('NEDO_IDS', actual)
          if actual != reference:
              raise SystemExit(f'tokenizer parity failure: expected {reference}, got {actual}')
          if model.detokenize(actual) != prompt:
              raise SystemExit('tokenizer round-trip failure')
          print('EXACT_PARITY true')
          PY
