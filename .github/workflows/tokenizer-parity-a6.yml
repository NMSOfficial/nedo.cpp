name: tokenizer-parity-a6
on:
  push:
    branches: [generation-a6]
    paths: ['.github/workflows/tokenizer-parity-a6.yml']
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build official tokenizer and compare prompt
        shell: bash
        run: |
          echo 'parity pass 2'
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git /tmp/NedoTokenizer
          python -m pip install /tmp/NedoTokenizer
          python -m pip install .
          python - <<'PY'
          from pathlib import Path
          from nedotokenizer import SurfaceTokenizer
          import nedo.cpp as nedo
          prompt='Kullanıcı talimatı:\nmerhaba\n\nAsistan cevabı:\n'
          vocab=Path('/tmp/NedoTokenizer/assets/surface-vocab.bin').read_bytes()
          ref=SurfaceTokenizer(vocab)
          reference=list(ref.encode_ids(prompt.encode('utf-8')))
          m=nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          actual=m.tokenize(prompt)
          print('REFERENCE_IDS', reference)
          print('NEDO_IDS', actual)
          print('EXACT_PARITY', reference == actual)
          PY
