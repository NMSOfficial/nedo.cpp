name: apply-generation-a6
on:
  push:
    branches: [generation-a6]
    paths: ['.github/workflows/apply-a6.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - name: Apply generated source patch
        shell: bash
        run: |
          echo '' | base64 -d | tar -xz
          git config user.name 'Nedim Mutlu Sezer'
          git config user.email '154451479+NMSOfficial@users.noreply.github.com'
          git add src/model.cpp include/nedo/model.hpp src/kernels.cpp include/nedo/kernels.hpp pyproject.toml tests/test_kernels.cpp
          git commit -m 'Implement NedoLM MorphFFN generation core'
          git push origin HEAD:generation-a6
