name: smoke-generation-a6
on:
  push:
    branches: [generation-a6]
    paths:
      - 'src/model.cpp'
      - 'src/tokenizer.cpp'
      - 'src/kernels.cpp'
      - 'include/nedo/model.hpp'
      - 'include/nedo/tokenizer.hpp'
      - 'include/nedo/kernels.hpp'
      - '.github/workflows/smoke-a6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and unit test
        shell: bash
        run: |
          cmake -S . -B build -DNEDO_BUILD_PYTHON=OFF -DNEDO_NATIVE=OFF -DNEDO_BUILD_TESTS=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python -m pip install . pytest
          PYTHONPATH=python python -m pytest -q
      - name: F16 checkpoint generation smoke
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
        run: |
          MODEL_PATH=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF','NedoLM-0.8B-SFT-step-00006478-F16-NDSRF004.gguf'))
          PY
          )
          cat >/tmp/nedo_smoke.cpp <<'CPP'
          #include "nedo/model.hpp"
          #include <iomanip>
          #include <iostream>
          #include <stdexcept>
          int main(int argc,char**argv){
              nedo::NedoModel m(argv[1]);
              const std::string prompt="Kullanıcı talimatı:\nmerhaba\n\nAsistan cevabı:\n";
              const auto ids=m.tokenize(prompt,false);
              std::cout<<m.summary()<<"\nPROMPT_IDS";
              for(auto id:ids)std::cout<<' '<<id;
              std::cout<<"\n";
              nedo::GenerationConfig cfg; cfg.max_new_tokens=16; cfg.temperature=0.0f;
              const auto out=m.generate(prompt,cfg);
              std::cout<<"RAW_HEX ";
              for(unsigned char c:out)std::cout<<std::hex<<std::setw(2)<<std::setfill('0')<<(unsigned)c;
              std::cout<<std::dec<<"\nRAW_BYTES "<<out.size()<<"\n";
              std::cout.write(out.data(),static_cast<std::streamsize>(out.size()));
              std::cout<<"\n";
              if(out.empty()) throw std::runtime_error("generation returned empty output");
              if(out.find("Asistan cevabı:") != std::string::npos)
                  throw std::runtime_error("generation repeated the prompt label");
          }
          CPP
          c++ -std=c++20 -O2 -Iinclude /tmp/nedo_smoke.cpp build/libnedo_core.a -fopenmp -o /tmp/nedo_smoke
          /tmp/nedo_smoke "$MODEL_PATH"
