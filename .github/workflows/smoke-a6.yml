name: smoke-generation-a6
on:
  push:
    branches: [generation-a6]
    paths:
      - 'src/model.cpp'
      - 'src/tokenizer.cpp'
      - 'src/kernels.cpp'
      - 'src/pybind.cpp'
      - 'include/nedo/model.hpp'
      - 'include/nedo/tokenizer.hpp'
      - 'include/nedo/kernels.hpp'
      - 'python/nedo/cpp.py'
      - '.github/workflows/smoke-a6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and unit test
        shell: bash
        run: |
          cmake -S . -B build -DNEDO_BUILD_PYTHON=OFF -DNEDO_NATIVE=OFF -DNEDO_BUILD_TESTS=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git /tmp/NedoTokenizer
          python -m pip install /tmp/NedoTokenizer
          python -m pip install . pytest
          PYTHONPATH=python python -m pytest -q
      - name: F16 checkpoint production-API smoke
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python - <<'PY'
          import nedo.cpp as nedo

          prompt = 'Kullanıcı talimatı:\nmerhaba\n\nAsistan cevabı:\n'
          model = nedo.import_llm('Ethosoft/NedoLM-0.8B-SFT-6478-GGUF', quantization='F16')
          ids = model.tokenize(prompt)
          print(model.summary())
          print('PROMPT_IDS', ids, flush=True)
          cfg = nedo.GenerationConfig()
          cfg.max_new_tokens = 16
          cfg.temperature = 0.0
          out = model.generate(prompt, cfg)
          print('RAW_OUTPUT_BEGIN', flush=True)
          print(out, flush=True)
          print('RAW_OUTPUT_END', flush=True)
          print('RAW_REPR', repr(out), flush=True)
          if not out:
              raise SystemExit('generation returned empty output')
          if 'Asistan cevabı:' in out:
              raise SystemExit('generation repeated the prompt label')
          PY
