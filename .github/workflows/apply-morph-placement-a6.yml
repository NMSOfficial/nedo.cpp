name: apply-morph-placement-a6
on:
  push:
    branches: [generation-a6]
    paths: ['.github/workflows/apply-morph-placement-a6.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generation-a6
      - name: Apply final MorphFFN placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/model.cpp')
          s=p.read_text()
          old='if(layer>=cfg_.morph_layers || !route) return;'
          new='if(layer < cfg_.layers - cfg_.morph_layers || !route) return;'
          assert old in s
          s=s.replace(old,new,1)
          old_comment='// Export contract: FFN neurons are laid out [shared | root | suffix].\n        // The tid2eid pair is [ROOT, SUFFIX]; OTHER is (0,0). Shared is always active.'
          new_comment='// NedoLM keeps the first (layers-morph_layers) blocks on the standard FFN path;\n        // MorphFFN occupies the trailing blocks. Neurons are [shared | root | suffix].\n        // The tid2eid pair is [ROOT, SUFFIX]; OTHER is (0,0). Shared is always active.'
          assert old_comment in s
          p.write_text(s.replace(old_comment,new_comment,1))
          PY
          git config user.name 'NMSOfficial'
          git config user.email '154451479+NMSOfficial@users.noreply.github.com'
          git add src/model.cpp
          git commit -m 'Fix MorphFFN trailing-layer placement'
          git push origin generation-a6
