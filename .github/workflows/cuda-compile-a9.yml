name: cuda-compile-a9
on:
  push:
    branches: [cuda-a9]
    paths:
      - 'CMakeLists.txt'
      - 'include/nedo/**'
      - 'src/**'
      - '.github/workflows/cuda-compile-a9.yml'
permissions:
  contents: read
jobs:
  nvcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA compiler
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
      - name: CUDA compiler
        run: nvcc --version
      - name: Configure CUDA core
        env:
          NEDO_CUDA_BUILD: '1'
        run: cmake -S . -B build -DNEDO_BUILD_PYTHON=OFF -DNEDO_BUILD_TESTS=ON -DNEDO_NATIVE=OFF
      - name: Build CUDA core
        run: cmake --build build -j2
      - name: CPU fallback tests in CUDA build
        run: ctest --test-dir build --output-on-failure
