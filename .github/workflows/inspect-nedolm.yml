name: inspect-nedolm-header
on:
  push:
    paths:
      - '.github/workflows/inspect-nedolm.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read NedoLM routing table range
        shell: bash
        run: |
          python - <<'PY'
          import struct, urllib.request, collections
          url='https://huggingface.co/Ethosoft/NedoLM-0.8B-SFT-6478-GGUF/resolve/main/NedoLM-0.8B-SFT-step-00006478-F16-NDSRF004.gguf'
          # Header ended at 659623; GGUF alignment is 32 => data starts at 659648.
          # blk.0.ffn_gate_tid2eid.weight has relative offset 1646303232,
          # shape [2,32000], F32 => 256000 bytes.
          start=659648+1646303232
          size=2*32000*4
          req=urllib.request.Request(url,headers={'Range':f'bytes={start}-{start+size-1}','User-Agent':'nedo.cpp-routing-probe'})
          with urllib.request.urlopen(req) as r:
              raw=r.read(size)
          print('ROUTE_RANGE',start,len(raw))
          if len(raw)!=size: raise SystemExit(f'expected {size} bytes')
          vals=struct.unpack('<'+('f'*(2*32000)),raw)
          pairs=[(vals[2*i],vals[2*i+1]) for i in range(32000)]
          counts=collections.Counter(pairs)
          print('UNIQUE_PAIRS',len(counts))
          for pair,count in counts.most_common(20): print('PAIR',pair,'COUNT',count)
          for pair in counts:
              ids=[i for i,p in enumerate(pairs) if p==pair][:20]
              print('EXAMPLE_IDS',pair,ids)
          PY
