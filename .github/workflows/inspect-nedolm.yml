name: inspect-nedolm-header
on:
  push:
    paths:
      - '.github/workflows/inspect-nedolm.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Map routing channels to NDSRF004 tokens
        shell: bash
        run: |
          python - <<'PY'
          import io,struct,urllib.request,collections
          url='https://huggingface.co/Ethosoft/NedoLM-0.8B-SFT-6478-GGUF/resolve/main/NedoLM-0.8B-SFT-step-00006478-F16-NDSRF004.gguf'
          def get_range(a,b):
              q=urllib.request.Request(url,headers={'Range':f'bytes={a}-{b}','User-Agent':'nedo.cpp-routing-probe'})
              with urllib.request.urlopen(q) as r:return r.read(b-a+1)
          # Parse header and keep tokenizer strings.
          f=io.BytesIO(get_range(0,1048575))
          def rd(fmt):
              n=struct.calcsize('<'+fmt);return struct.unpack('<'+fmt,f.read(n))[0]
          def s():
              n=rd('Q');return f.read(n).decode('utf-8','replace')
          fmts={0:'B',1:'b',2:'H',3:'h',4:'I',5:'i',6:'f',7:'B',10:'Q',11:'q',12:'d'}
          def scalar(t):return s() if t==8 else rd(fmts[t])
          def value(t,key):
              if t!=9:return scalar(t)
              et=rd('I');n=rd('Q')
              vals=[scalar(et) for _ in range(n)]
              return vals if key=='tokenizer.ggml.tokens' else None
          assert f.read(4)==b'GGUF';ver=rd('I');nt=rd('Q');nkv=rd('Q')
          tokens=None
          for _ in range(nkv):
              key=s();typ=rd('I');v=value(typ,key)
              if key=='tokenizer.ggml.tokens':tokens=v
          assert tokens and len(tokens)==32000
          # Special table: data offset 659648 + relative offset 1646303232.
          start=1646962880; size=256000
          raw=get_range(start,start+size-1)
          vals=struct.unpack('<'+('f'*64000),raw)
          pairs=[(vals[2*i],vals[2*i+1]) for i in range(32000)]
          groups=collections.defaultdict(list)
          for i,p in enumerate(pairs):
              if len(groups[p])<60:groups[p].append((i,tokens[i]))
          for p,items in groups.items():
              print('CHANNEL',p,'COUNT',pairs.count(p))
              print('TOKENS',items)
          PY
