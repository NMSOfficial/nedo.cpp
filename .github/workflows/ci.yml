name: ci
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNEDO_BUILD_PYTHON=OFF -DNEDO_NATIVE=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install . pytest
      - run: pytest -q
      - run: python -c "import nedo.cpp as nedo; from nedo._hub import parse_hf_source; assert parse_hf_source('Ethosoft/NedoLM-0.8B-SFT-GGUF').repo_id == 'Ethosoft/NedoLM-0.8B-SFT-GGUF'; print(nedo.__all__)"
